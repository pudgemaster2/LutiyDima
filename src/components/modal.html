<div class="modal" id="{{id}}">
  <div class="modal__dialog">
    <!-- Шапка модалки -->
    <div class="modal__header">
      {{#if title}}
        {{> title text=title tag="h3" class="modal__title" }}
      {{/if}}
      <button class="modal__close" data-modal-close aria-label="Закрыть">&times;</button>
    </div>
    
    <!-- Основной контент (Body + Footer) вставляется через partial-block -->
    {{> @partial-block }}
  </div>
</div>
